name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npx playwright install --with-deps chromium
      - name: e2e no app de teste
        run: |
          npm run dev > /tmp/calu-dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://127.0.0.1:8080/ && break; sleep 2; done
          curl -sf -o /dev/null http://127.0.0.1:8080/
          npm run test:e2e
        env:
          CALU_ENV: test
          BETTER_AUTH_SECRET: ci-e2e-secret-not-for-production-use
          BETTER_AUTH_URL: http://127.0.0.1:8080

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smartnutri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:pg
        env:
          CI_POSTGRES: "1"
          CALU_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/smartnutri_test
